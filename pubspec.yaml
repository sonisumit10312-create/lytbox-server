workflow:
  name: Default Workflow
  max_build_duration: 30
  instance_type: mac_mini_m2
  working_directory: LYTBOX-SERVER
  
  triggering:
    events:
      - push
    branches:
      - main

  build:
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    scripts:
      - name: Set up pubspec and build APK
        script: |
          flutter pub get
          flutter build apk --release