workflows:
  default-workflow:
    name: Lytbox Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: LYTBOX-SERVER
    triggering:
      events:
        - push
    scripts:
      - name: Fetch dependencies and Build APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - LYTBOX-SERVER/build/app/outputs/flutter-apk/*.apk